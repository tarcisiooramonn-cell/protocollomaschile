      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      font-family: Arial, sans-serif;

    }


    .page-wrapper {

      display: flex;
      flex-direction: column;

      align-items: center;

      width: 100%;

      flex: 1;

      justify-content: center;

      padding: 40px 20px 20px;

    }


    /* =====================================================
       HEADLINE
    ====================================================== */

    .headline {

      width: 100%;
      max-width: 500px;

      text-align: center;

      margin-bottom: 18px;

      font-family: Georgia, serif;

      font-size: 24px;
      font-weight: 700;

      color: #1a1a1a;

      line-height: 1.4;

    }


    .headline span {

      color: #c0392b;

    }


    /* =====================================================
       VIDEO
    ====================================================== */

    .video-container {

      width: 100%;
      max-width: 500px;

      position: relative;

    }


    /* =====================================================
       LIVE COUNTER
    ====================================================== */

    .live-counter {

      width: 100%;
      max-width: 500px;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 8px;

      margin-top: 10px;

      background: #fff;

      border: 1px solid #dddfe2;

      border-radius: 20px;

      padding: 8px 18px;

    }


    .live-dot {

      width: 10px;
      height: 10px;

      border-radius: 50%;

      background: #e00;

      flex-shrink: 0;

      animation: pulse 1.2s infinite;

    }


    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }

    }


    .live-text {

      font-size: 14px;

      color: #333;

      font-weight: 600;

    }


    .live-text span {

      color: #e00;

    }


    /* =====================================================
       SOUND HINT
    ====================================================== */

    .sound-hint {

      margin-top: 14px;

      display: flex;

      align-items: center;

      gap: 7px;

      color: #555;

      font-size: 13.5px;

      letter-spacing: 0.01em;

    }


    .sound-hint svg {

      width: 18px;
      height: 18px;

      flex-shrink: 0;

    }


    /* =====================================================
       FOOTER
    ====================================================== */

    footer {

      width: 100%;

      text-align: center;

      padding: 32px 0 18px;

      color: #999;

      font-size: 12.5px;

      line-height: 1.7;

      letter-spacing: 0.01em;

    }


    /* =====================================================
       MOBILE
    ====================================================== */

    @media (max-width: 600px) {

      .page-wrapper {

        padding:
          24px
          14px
          18px;

      }


      .headline {

        font-size: 22px;

        margin-bottom: 16px;

      }


      .live-text {

        font-size: 13px;

      }

    }

  <script>

    var count = 285;


    function updateCounter() {

      var change =
        Math.floor(
          Math.random() * 7
        ) - 3;


      count =
        Math.max(
          240,
          Math.min(
            350,
            count + change
          )
        );


      var counterElement =
        document.getElementById(
          'counter'
        );


      if(counterElement){

        counterElement.textContent =
          count;

      }

    }


    setInterval(
      updateCounter,
      3000
    );
